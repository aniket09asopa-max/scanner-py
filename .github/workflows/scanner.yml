name: NSE Anomaly Scan

on:
  schedule:
    # Runs Monday to Friday at 3:45 PM IST (10:15 AM UTC)
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # Allows you to run it manually with 1 click

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy

      - name: Execute Anomaly Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
